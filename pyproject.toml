[project]
name = "xmindpy"
version = "0.1.0"
description = "Modern Python SDK for XMind 2020+ JSON format. A clean rewrite of zhuifengshen/xmind for the new file format."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Funnlink", email = "edward@innoshop.com"},
]
keywords = ["xmind", "mind-map", "思维导图", "json", "xmind-2020"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Funnlink/xmindpy"
Repository = "https://github.com/Funnlink/xmindpy"
Issues = "https://github.com/Funnlink/xmindpy/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xmindpy"]

[tool.hatch.build.targets.sdist]
include = ["xmindpy", "README.md", "LICENSE"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
        # First-time publish: use a PyPI API token. Create one at
        # https://pypi.org/manage/account/token/ (scope: project: xmindpy)
        # and add it as a repository secret named PYPI_API_TOKEN at
        # https://github.com/innotools/xmindpy/settings/secrets/actions.
        # Once the project exists on PyPI, you can migrate to
        # trusted publishing (OIDC) and remove this token.